name: homeserver_saf
description: Native Android USB storage access for HomeServer using Storage Access Framework.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.homeserver.ssdbridge
        pluginClass: HomeServerSafPlugin
