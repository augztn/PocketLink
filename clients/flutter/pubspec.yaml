name: pocketlink_client
description: PocketLink Flutter client and native Android host.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  crypto: ^3.0.6
  file_picker: ^8.1.7
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.2
  cross_file: ^0.3.4+2
  flutter_secure_storage: ^10.3.4
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  pocketlink_saf:
    path: packages/pocketlink_saf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
