name: homeserver_client
description: Cross-platform client for managing self-hosted HomeServer instances.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  crypto: ^3.0.6
  file_picker: ^8.1.7
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2
  flutter_secure_storage: ^9.2.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  homeserver_saf:
    path: packages/homeserver_saf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
