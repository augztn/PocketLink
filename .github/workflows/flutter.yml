name: Flutter CI

on:
  push:
    paths:
      - "clients/flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "clients/flutter/**"
      - ".github/workflows/flutter.yml"

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
