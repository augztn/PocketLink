name: Flutter CI

on:
  push:
    paths:
      - "clients/flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "clients/flutter/**"
      - ".github/workflows/flutter.yml"

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  linux-appimage:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev wget
      - name: Generate Linux desktop project
        run: flutter create --platforms=linux --project-name homeserver_client .
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package AppImage
        run: |
          set -euo pipefail
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/lib/homeserver" "$APPDIR/usr/bin"
          cp -a build/linux/x64/release/bundle/. "$APPDIR/usr/lib/homeserver/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib/homeserver/lib:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/lib/homeserver/homeserver_client" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/homeserver.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HomeServer
          Comment=Manage your self-hosted HomeServer
          Exec=AppRun
          Icon=homeserver
          Categories=Utility;FileTransfer;
          Terminal=false
          EOF
          cat > "$APPDIR/homeserver.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="26" fill="#536DFE"/>
            <path d="M22 60 64 24l42 36v43H75V76H53v27H22Z" fill="#fff"/>
            <path d="M49 53h30v8H49z" fill="#536DFE"/>
          </svg>
          EOF
          cp "$APPDIR/homeserver.svg" "$APPDIR/.DirIcon"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "$PWD/HomeServer-x86_64.AppImage"
          chmod +x "$PWD/HomeServer-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: HomeServer-Linux-x86_64-AppImage
          path: clients/flutter/HomeServer-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
