name: Flutter CI
run-name: PocketLink CI • ${{ github.event_name }} • ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "clients/flutter/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "clients/flutter/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Keep only the newest validation for a branch/PR; stale runs waste hosted minutes.
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Flutter Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-fatal-infos

  test:
    name: Flutter Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run Flutter unit and widget test shard
        run: flutter test --total-shards=3 --shard-index=${{ matrix.shard }}

  linux-appimage:
    name: Linux AppImage Build
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev mpv wget appstream
      - name: Generate Linux desktop project
        run: flutter create --platforms=linux --project-name pocketlink .
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - name: Package AppImage
        run: |
          set -euo pipefail
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/lib/pocketlink" "$APPDIR/usr/bin"
          cp -a build/linux/x64/release/bundle/. "$APPDIR/usr/lib/pocketlink/"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib/pocketlink/lib:${LD_LIBRARY_PATH:-}"
          exec "$HERE/usr/lib/pocketlink/pocketlink" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/pocketlink.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PocketLink
          Comment=Manage your private PocketLink server
          Exec=AppRun
          Icon=pocketlink
          Categories=Utility;FileTransfer;
          Terminal=false
          EOF
          cat > "$APPDIR/pocketlink.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="26" fill="#536DFE"/>
            <path d="M22 60 64 24l42 36v43H75V76H53v27H22Z" fill="#fff"/>
            <path d="M49 53h30v8H49z" fill="#536DFE"/>
          </svg>
          EOF
          cp "$APPDIR/pocketlink.svg" "$APPDIR/.DirIcon"
          mkdir -p "$APPDIR/usr/share/metainfo"
          cat > "$APPDIR/usr/share/metainfo/io.github.augztn.pocketlink.metainfo.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>io.github.augztn.pocketlink</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>MIT</project_license>
            <name>PocketLink</name>
            <summary>Manage your private PocketLink server</summary>
            <description><p>Browse and manage files on your personal PocketLink server.</p></description>
            <launchable type="desktop-id">pocketlink.desktop</launchable>
            <provides><binary>pocketlink</binary></provides>
          </component>
          EOF
          appstreamcli validate "$APPDIR/usr/share/metainfo/io.github.augztn.pocketlink.metainfo.xml"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "$PWD/PocketLink-x86_64.AppImage"
          chmod +x "$PWD/PocketLink-x86_64.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: PocketLink-Linux-x86_64-AppImage
          path: clients/flutter/PocketLink-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android APK Build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true
      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: ${{ runner.os }}-android-ndk-28.2.13676358
      - name: Generate Android project
        run: flutter create --platforms=android --org io.github.augztn --project-name pocketlink .
      - name: Add JitPack repository for NewPipeExtractor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings_candidates = [Path("android/settings.gradle"), Path("android/settings.gradle.kts")]
          settings = next((path for path in settings_candidates if path.exists()), None)
          if settings is None:
              raise SystemExit("Generated Android settings.gradle was not found")

          settings_content = settings.read_text()
          if "jitpack.io" in settings_content:
              print("JitPack repository already configured in settings")
          elif "dependencyResolutionManagement" in settings_content:
              pattern = re.compile(
                  r"(dependencyResolutionManagement\s*\{[\s\S]*?repositories\s*\{)",
                  re.MULTILINE,
              )
              match = pattern.search(settings_content)
              if match is not None:
                  repository = '        maven(url = "https://jitpack.io")\n'
                  settings_content = settings_content[:match.end()] + "\n" + repository + settings_content[match.end():]
              else:
                  settings_content += (
                      '\ndependencyResolutionManagement {\n'
                      '    repositories {\n'
                      '        google()\n'
                      '        mavenCentral()\n'
                      '        maven(url = "https://jitpack.io")\n'
                      '    }\n'
                      '}\n'
                  )
              settings.write_text(settings_content)
              print(f"Added JitPack to {settings}")
          else:
              root_candidates = [Path("android/build.gradle"), Path("android/build.gradle.kts")]
              root_build = next((path for path in root_candidates if path.exists()), None)
              if root_build is None:
                  raise SystemExit("Generated Android root Gradle file was not found")
              root_content = root_build.read_text()
              if "jitpack.io" not in root_content:
                  pattern = re.compile(r"(allprojects\s*\{[\s\S]*?repositories\s*\{)", re.MULTILINE)
                  match = pattern.search(root_content)
                  if match is None:
                      raise SystemExit("Could not locate allprojects repositories in Android root Gradle file")
                  repository = (
                      '        maven(url = "https://jitpack.io")\n'
                      if root_build.suffix == ".kts"
                      else '        maven { url "https://jitpack.io" }\n'
                  )
                  root_content = root_content[:match.end()] + "\n" + repository + root_content[match.end():]
                  root_build.write_text(root_content)
                  print(f"Added JitPack to {root_build}")
          PY
      - name: Enable network access for HTTP and HTTPS servers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          content = re.sub(
              r'android:label="[^"]*"',
              'android:label="PocketLink"',
              content,
              count=1,
          )
          if 'android:label="PocketLink"' not in content:
              raise SystemExit("Could not set Android app label to PocketLink")
          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET" />\n\n    <application',
                  1,
              )
          content, cleartext_count = re.subn(
              r'android:usesCleartextTraffic="[^"]*"',
              'android:usesCleartextTraffic="true"',
              content,
              count=1,
          )
          if cleartext_count == 0:
              content = re.sub(
                  r"<application\b",
                  '<application\n        android:usesCleartextTraffic="true"',
                  content,
                  count=1,
              )
          manifest.write_text(content)
          if (
              "android.permission.INTERNET" not in content
              or 'android:usesCleartextTraffic="true"' not in content
          ):
              raise SystemExit("Android network configuration was not applied")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((path for path in candidates if path.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file not found")
          content = gradle.read_text()
          expected_package = "io.github.augztn.pocketlink"
          normalized = content.replace("'", '"')
          for field in ("namespace", "applicationId"):
              pattern = rf'(?m)^\s*{field}\s*(?:=\s*)?"{re.escape(expected_package)}"'
              if not re.search(pattern, normalized):
                  raise SystemExit(
                      f"Expected Android {field} to be {expected_package}"
                  )
          updated, count = re.subn(
              r"compileSdk\s*(?:=)?\s*flutter\.compileSdkVersion",
              "compileSdk = 36" if gradle.suffix == ".kts" else "compileSdkVersion 36",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not set Android compileSdk to 36")
          updated, min_sdk_count = re.subn(
              r"(?m)^(\s*)minSdk(?:Version)?\s*(?:=\s*)?flutter\.minSdkVersion",
              r"\g<1>minSdk = 24" if gradle.suffix == ".kts" else r"\g<1>minSdkVersion 24",
              updated,
              count=1,
          )
          if min_sdk_count != 1:
              raise SystemExit("Could not set Android minSdk to API 24")
          gradle.write_text(updated)
          print(f"Configured {gradle} for compileSdk 36 and minSdk 24 (Android 7.0+)")
          PY
          python3 - <<'PY'
          from pathlib import Path

          properties = Path("android/gradle.properties")
          if not properties.exists():
              raise SystemExit("Generated Android gradle.properties was not found")
          lines = [
              line for line in properties.read_text().splitlines()
              if not line.strip().startswith("android.builtInKotlin=")
          ]
          lines.append("android.builtInKotlin=true")
          properties.write_text("\n".join(lines) + "\n")
          print("Enabled AGP built-in Kotlin after migrating app plugins")
          PY
      - run: flutter pub get --enforce-lockfile
      - name: Align Android plugin compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          plugin_patterns = (
              "android_file_picker-*/android",
              "file_picker-*/android",
              "package_info_plus-*/android",
              "share_plus-*/android",
          )
          plugin_dirs = sorted({
              path
              for pattern in plugin_patterns
              for path in Path.home().glob(f".pub-cache/hosted/pub.dev/{pattern}")
          })
          if not any(path.parent.name.startswith("android_file_picker-") for path in plugin_dirs):
              raise SystemExit("android_file_picker Android plugin was not found in the pub cache")

          patched = []
          for plugin_dir in plugin_dirs:
              for gradle in (plugin_dir / "build.gradle", plugin_dir / "build.gradle.kts"):
                  if not gradle.exists():
                      continue
                  content = gradle.read_text()
                  updated, count = re.subn(
                      r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)",
                      r"\g<1>36",
                      content,
                      count=1,
                  )
                  if count:
                      gradle.write_text(updated)
                      patched.append(str(gradle))
          print("Checked Android plugin compile SDK; updated: " + (", ".join(patched) if patched else "no overrides needed"))
          PY
      - name: Build Android APK (retry only transient NDK setup failures)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK path is not configured}}"
          for attempt in 1 2; do
            set +e
            flutter build apk --release 2>&1 | tee /tmp/pocketlink-apk-build.log
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "$build_status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ] && grep -Eiq 'NDK at .*did not have a source\\.properties|failed to install.*NDK|NDK.*(download|install).*(failed|error)' /tmp/pocketlink-apk-build.log; then
              echo "Detected an incomplete NDK installation; clearing it and retrying once."
              rm -rf "$SDK_ROOT/ndk/28.2.13676358" "$SDK_ROOT/.temp"
              continue
            fi
            echo "::error::Android APK build failed; not retrying a non-transient build error."
            exit "$build_status"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: PocketLink-Android-APK
          path: clients/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run native Android unit tests
        run: cd android && ./gradlew :pocketlink_saf:testDebugUnitTest
      - name: Enable KVM acceleration for Android emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device is unavailable on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Run native Android integration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            cd clients/flutter/android && ./gradlew --no-daemon --stacktrace :pocketlink_saf:connectedDebugAndroidTest
